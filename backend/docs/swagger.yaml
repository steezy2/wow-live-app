basePath: /
definitions:
  controller.ChangeEvent:
    properties:
      version:
        type: integer
    type: object
  controller.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  controller.OldKeys:
    properties:
      read:
        type: integer
      saved:
        type: integer
    type: object
  models.AbilitySeries:
    properties:
      a:
        type: string
      p:
        description: '[end clockMS, damage, healing, damage taken]'
        items:
          items:
            format: int64
            type: integer
          type: array
        type: array
    type: object
  models.Affix:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  models.Credentials:
    properties:
      id:
        type: string
      secret:
        type: string
    type: object
  models.DungeonFloor:
    properties:
      maxX:
        type: number
      maxY:
        type: number
      minX:
        type: number
      minY:
        type: number
      tiles:
        type: string
      uiMapID:
        type: integer
    type: object
  models.DungeonMap:
    properties:
      floors:
        items:
          $ref: '#/definitions/models.DungeonFloor'
        type: array
      walked:
        items:
          $ref: '#/definitions/models.TrackPoint'
        type: array
    type: object
  models.ForcesPace:
    properties:
      bestPct:
        type: number
      fasterPct:
        type: number
    type: object
  models.ForcesPoint:
    properties:
      clockMS:
        type: integer
      pct:
        type: number
    type: object
  models.KeyAbility:
    properties:
      ability:
        type: string
      casts:
        type: integer
      damage:
        type: integer
      healing:
        type: integer
      hits:
        type: integer
      player:
        type: string
      school:
        type: integer
    type: object
  models.KeyBoss:
    properties:
      endMS:
        type: integer
      kill:
        type: boolean
      name:
        type: string
      startMS:
        type: integer
    type: object
  models.KeyBuffCheck:
    properties:
      missing:
        items:
          type: string
        type: array
      player:
        type: string
    type: object
  models.KeyCast:
    properties:
      ability:
        type: string
      clockMS:
        type: integer
      endMS:
        description: 'a raid cooldown: when its buff last left a raider (0 when none
          was seen to)'
        type: integer
      kind:
        enum:
        - defensive
        - healthstone
        - health potion
        - combat potion
        - kick
        - cc
        - raid cooldown
        type: string
      player:
        type: string
      prepot:
        description: a combat potion drunk before the run started
        type: boolean
    type: object
  models.KeyDeath:
    properties:
      ability:
        type: string
      clockMS:
        type: integer
      defensive:
        type: string
      killer:
        type: string
      player:
        type: string
      ready:
        items:
          type: string
        type: array
    type: object
  models.KeyDispel:
    properties:
      afterMS:
        type: integer
      by:
        type: string
      clockMS:
        type: integer
      player:
        type: string
      spell:
        type: string
    type: object
  models.KeyForces:
    properties:
      at:
        items:
          $ref: '#/definitions/models.ForcesPoint'
        type: array
      count:
        type: integer
      needsCheck:
        type: boolean
      pace:
        $ref: '#/definitions/models.ForcesPace'
      pct:
        type: number
      total:
        type: integer
      uncounted:
        items:
          $ref: '#/definitions/models.UncountedNPC'
        type: array
    type: object
  models.KeyGhost:
    properties:
      killMS:
        type: integer
      name:
        type: string
      needByMS:
        type: integer
    type: object
  models.KeyHit:
    properties:
      ability:
        type: string
      damage:
        type: integer
      hits:
        description: direct hits; 0 in keys saved before Nov 9
        type: integer
      player:
        type: string
      school:
        type: integer
    type: object
  models.KeyInterrupt:
    properties:
      clockMS:
        type: integer
      kick:
        description: the player's spell that did it ("Wind Shear"); empty in keys
          saved before Nov 8
        type: string
      player:
        type: string
      spell:
        type: string
      target:
        type: string
    type: object
  models.KeyMeter:
    properties:
      endMS:
        type: integer
      ongoing:
        description: the pull is still being fought (no pullGapMS pause yet)
        type: boolean
      rows:
        items:
          $ref: '#/definitions/models.KeyMeterRow'
        type: array
      startMS:
        type: integer
    type: object
  models.KeyMeterRow:
    properties:
      avoidable:
        type: integer
      class:
        description: '"Mage", "DeathKnight"; "" when unknown'
        type: string
      damage:
        type: integer
      damageTaken:
        type: integer
      dispels:
        type: integer
      dps:
        type: number
      healing:
        type: integer
      hps:
        type: number
      interrupts:
        type: integer
      player:
        type: string
      priorityDamage:
        description: damage into trash pulls' minibosses and into bosses
        type: integer
      purges:
        type: integer
    type: object
  models.KeyMiniboss:
    properties:
      diedMS:
        type: integer
      name:
        type: string
      of:
        type: integer
      order:
        type: integer
    type: object
  models.KeyProjection:
    properties:
      best:
        items:
          $ref: '#/definitions/models.KeyGhost'
        type: array
      chests:
        type: integer
      finalMS:
        type: integer
      highMS:
        type: integer
      lowMS:
        type: integer
      odds:
        items:
          type: number
        type: array
      runs:
        type: integer
      source:
        description: '"3 of your runs, forces and bosses"'
        type: string
    type: object
  models.KeyPull:
    properties:
      clockMS:
        type: integer
      healthPct:
        type: number
      late:
        type: boolean
      minibosses:
        items:
          $ref: '#/definitions/models.KeyMiniboss'
        type: array
      openingPct:
        type: number
      priorityPct:
        type: number
      pull:
        type: integer
    type: object
  models.KeyReview:
    properties:
      baseline:
        type: string
      end:
        type: integer
      notes:
        description: 'the party as a whole: deaths'' cost, must-stop casts, time between
          pulls'
        items:
          type: string
        type: array
      party:
        type: string
      players:
        items:
          $ref: '#/definitions/models.PlayerReview'
        type: array
      points:
        type: number
      start:
        type: integer
      topBosses:
        additionalProperties:
          format: int64
          type: integer
        description: |-
          TopBosses is how long each boss took in the similar top runs (the median, by boss name; missing in reviews
          saved before Nov 11).
        type: object
    type: object
  models.KeySpike:
    properties:
      clockMS:
        type: integer
      damage:
        type: integer
      members:
        items:
          $ref: '#/definitions/models.KeySpikeMember'
        type: array
      overlap:
        type: boolean
      partyCDs:
        items:
          type: string
        type: array
    type: object
  models.KeySpikeMember:
    properties:
      defensive:
        type: string
      player:
        type: string
      ready:
        items:
          type: string
        type: array
      taken:
        type: integer
    type: object
  models.KeyStatus:
    properties:
      idEnd:
        type: string
      limitPerHour:
        type: number
      pointsLeft:
        type: number
      problem:
        type: string
      set:
        type: boolean
      testedMS:
        type: integer
      works:
        type: boolean
    type: object
  models.KeyStop:
    properties:
      by:
        type: string
      clockMS:
        type: integer
      intoMS:
        type: integer
      mob:
        type: string
      outcome:
        enum:
        - interrupted
        - stopped
        - went off
        - died
        type: string
      pull:
        type: integer
      spell:
        type: string
    type: object
  models.KeySummary:
    properties:
      chests:
        type: integer
      dungeon:
        type: string
      finalMS:
        type: integer
      level:
        type: integer
      start:
        type: integer
      status:
        type: string
    type: object
  models.KeyTrack:
    properties:
      abilities:
        additionalProperties:
          items:
            $ref: '#/definitions/models.AbilitySeries'
          type: array
        type: object
      abilityTimes:
        description: 'AbilityTimes is when Abilities'' stretches ended, in order:
          a stretch starts where the one before it ended.'
        items:
          type: integer
        type: array
      bosses:
        additionalProperties:
          items:
            $ref: '#/definitions/models.TrackPoint'
          type: array
        description: |-
          Bosses is a raid boss's units and the adds to burst (by GUID, each point named, with its health) about once a
          second; none in a key.
        type: object
      casts:
        additionalProperties:
          items:
            $ref: '#/definitions/models.TrackCast'
          type: array
        description: |-
          Casts is each raider's casts in order, and Abilities what each one's abilities did in each abilityEveryMS
          stretch, so the replay shows what a raider was casting and their bars up to its moment; none in a key, or in
          pulls saved before Nov 11.
        type: object
      classes:
        additionalProperties:
          type: string
        type: object
      deaths:
        items:
          $ref: '#/definitions/models.TrackPoint'
        type: array
      health:
        description: |-
          Health is the Bosses GUIDs the replay's health box shows: the units whose health is the boss's, then the adds
          to burst.
        items:
          type: string
        type: array
      meters:
        additionalProperties:
          items:
            $ref: '#/definitions/models.MeterPoint'
          type: array
        description: each player's damage and healing so far, about every 2 s
        type: object
      players:
        additionalProperties:
          items:
            $ref: '#/definitions/models.TrackPoint'
          type: array
        type: object
      pulls:
        description: each pull, in order; missing in keys saved before Nov 8
        items:
          $ref: '#/definitions/models.PullSpan'
        type: array
      targetSeries:
        additionalProperties:
          items:
            $ref: '#/definitions/models.AbilitySeries'
          type: array
        description: TargetSeries is each raider's damage into each enemy (by name,
          as Ability) in the same stretches.
        type: object
    type: object
  models.KeyView:
    properties:
      abilities:
        description: |-
          Abilities is each player's damage, healing and casts by ability, and Taken their damage taken by ability, most
          first: there once the key is over, and missing in keys saved before Nov 10.
        items:
          $ref: '#/definitions/models.KeyAbility'
        type: array
      activity:
        additionalProperties:
          format: float64
          type: number
        description: Activity is each player's share of their time alive in pulls
          with a cast going or a hit landing (in %).
        type: object
      affixes:
        items:
          $ref: '#/definitions/models.Affix'
        type: array
      avoidableHits:
        description: AvoidableHits is each player's avoidable damage by ability, most
          first.
        items:
          $ref: '#/definitions/models.KeyHit'
        type: array
      bestBosses:
        additionalProperties:
          format: int64
          type: integer
        type: object
      betweenPulls:
        description: BetweenPulls is the time between each pull and the one before
          it (from the second pull), on the key's clock.
        items:
          type: integer
        type: array
      bosses:
        items:
          $ref: '#/definitions/models.KeyBoss'
        type: array
      buffs:
        items:
          $ref: '#/definitions/models.KeyBuffCheck'
        type: array
      casts:
        items:
          $ref: '#/definitions/models.KeyCast'
        type: array
      chests:
        type: integer
      clockMS:
        type: integer
      deaths:
        items:
          $ref: '#/definitions/models.KeyDeath'
        type: array
      debuffs:
        description: dispellable debuffs on the party and how fast they came off
        items:
          $ref: '#/definitions/models.KeyDispel'
        type: array
      dungeon:
        type: string
      end:
        type: integer
      finalMS:
        description: the game's own time for the key, once it ends
        type: integer
      forces:
        allOf:
        - $ref: '#/definitions/models.KeyForces'
        description: nil when the dungeon file doesn't have the dungeon
      interrupts:
        items:
          $ref: '#/definitions/models.KeyInterrupt'
        type: array
      lastPull:
        $ref: '#/definitions/models.KeyMeter'
      level:
        type: integer
      logger:
        description: Logger is the party member whose game wrote the log ("" in keys
          saved before Nov 11).
        type: string
      lusts:
        description: Lusts is when the party got Bloodlust or a copy, on the key's
          clock.
        items:
          type: integer
        type: array
      mapID:
        type: integer
      overall:
        $ref: '#/definitions/models.KeyMeter'
      penaltyMS:
        type: integer
      players:
        items:
          type: string
        type: array
      plus2MS:
        type: integer
      plus3MS:
        type: integer
      projection:
        $ref: '#/definitions/models.KeyProjection'
      pulls:
        description: Pulls is each pull that had priority mobs, in order.
        items:
          $ref: '#/definitions/models.KeyPull'
        type: array
      reference:
        description: reference/mplus-dungeons.json has the dungeon (avoidable list,
          forces)
        type: boolean
      silentMS:
        description: |-
          SilentMS is how long ago the last line of a running key was logged (0 once it's over). The game writes its log
          in batches as fights start and end, so a long silence is a long fight, or a party that left.
        type: integer
      specs:
        additionalProperties:
          type: integer
        description: player -> specialization ID, from COMBATANT_INFO
        type: object
      spikes:
        description: the worst bursts of party damage taken, worst first
        items:
          $ref: '#/definitions/models.KeySpike'
        type: array
      start:
        type: integer
      status:
        enum:
        - running
        - timed
        - depleted
        - abandoned
        type: string
      stops:
        description: must-stop casts and what happened to each
        items:
          $ref: '#/definitions/models.KeyStop'
        type: array
      taken:
        items:
          $ref: '#/definitions/models.KeyHit'
        type: array
      timerMS:
        description: the dungeon's time limit; 0 when Raider.IO doesn't list it
        type: integer
      wastedKicks:
        description: kicks that interrupted nothing
        items:
          $ref: '#/definitions/models.KeyCast'
        type: array
    type: object
  models.MassKill:
    properties:
      ability:
        type: string
      clockMS:
        type: integer
      killed:
        type: integer
    type: object
  models.MeterPoint:
    properties:
      d:
        type: integer
      h:
        type: integer
      t:
        type: integer
      tk:
        description: damage taken so far; 0 in keys saved before Nov 8
        type: integer
    type: object
  models.OverlaySettings:
    properties:
      opacity:
        maximum: 100
        minimum: 0
        type: integer
      show:
        enum:
        - keys
        - always
        - "off"
        type: string
      split:
        description: Split shows the pull and the whole key as two cards, one above
          the other, instead of one card.
        type: boolean
    type: object
  models.PlayerCount:
    properties:
      count:
        type: integer
      player:
        type: string
    type: object
  models.PlayerReview:
    properties:
      advice:
        items:
          type: string
        type: array
      metrics:
        items:
          $ref: '#/definitions/models.ReviewMetric'
        type: array
      player:
        type: string
      positive:
        type: string
      spec:
        description: the spec and class, as the page shows them
        example: Blood Death Knight
        type: string
    type: object
  models.PullSpan:
    properties:
      endMS:
        type: integer
      startMS:
        type: integer
    type: object
  models.RaidAdd:
    properties:
      aliveEnd:
        type: integer
      killed:
        type: integer
      longestMS:
        type: integer
      name:
        type: string
      spawned:
        type: integer
      spawns:
        description: |-
          Spawns is each one's appearance and its cause, for adds the reference says how they spawn; missing in pulls
          saved before Nov 11.
        items:
          $ref: '#/definitions/models.RaidSpawn'
        type: array
    type: object
  models.RaidBreak:
    properties:
      aura:
        type: string
      clockMS:
        type: integer
      effect:
        type: string
      hit:
        type: integer
      player:
        type: string
    type: object
  models.RaidComparisons:
    properties:
      ever:
        $ref: '#/definitions/models.RaidPullSummary'
      tonight:
        $ref: '#/definitions/models.RaidPullSummary'
    type: object
  models.RaidDeath:
    properties:
      ability:
        type: string
      clockMS:
        type: integer
      defensive:
        type: string
      early:
        type: boolean
      killer:
        type: string
      player:
        type: string
      ready:
        items:
          type: string
        type: array
      recap:
        description: the last hits before the death, oldest first
        items:
          $ref: '#/definitions/models.RaidHit'
        type: array
    type: object
  models.RaidHit:
    properties:
      ability:
        type: string
      amount:
        type: integer
      beforeMS:
        type: integer
      source:
        type: string
    type: object
  models.RaidHits:
    properties:
      ability:
        type: string
      players:
        items:
          $ref: '#/definitions/models.PlayerCount'
        type: array
    type: object
  models.RaidLane:
    properties:
      kind:
        enum:
        - phases
        - deaths
        - lust
        - cooldowns
        - potions
        - spike
        - avoidable
        - soak
        - stacks
        - adds
        type: string
      marks:
        items:
          $ref: '#/definitions/models.RaidMark'
        type: array
      name:
        type: string
    type: object
  models.RaidLive:
    properties:
      betweenPulls:
        type: boolean
      boss:
        type: string
      last:
        $ref: '#/definitions/models.RaidPull'
      pulling:
        type: boolean
      ready:
        allOf:
        - $ref: '#/definitions/models.ReadyCheck'
        description: Ready is who's missing a flask, food, Vantus Rune or raid buff,
          in a raid between pulls.
      since:
        type: integer
    type: object
  models.RaidMap:
    properties:
      maxX:
        type: number
      maxY:
        type: number
      minX:
        type: number
      minY:
        type: number
      uiMapID:
        type: integer
    type: object
  models.RaidMark:
    properties:
      bad:
        type: boolean
      clockMS:
        type: integer
      endMS:
        type: integer
      text:
        type: string
    type: object
  models.RaidNight:
    properties:
      night:
        type: string
      pulls:
        items:
          $ref: '#/definitions/models.RaidPullSummary'
        type: array
    type: object
  models.RaidPickup:
    properties:
      clockMS:
        type: integer
      name:
        type: string
      players:
        items:
          type: string
        type: array
    type: object
  models.RaidPriority:
    properties:
      damage:
        type: integer
      target:
        type: string
    type: object
  models.RaidPull:
    properties:
      abilities:
        description: |-
          Abilities is each raider's damage, healing and casts by ability, Taken their damage taken by ability and Targets
          their damage into each enemy, most first: missing in pulls saved before Nov 11.
        items:
          $ref: '#/definitions/models.KeyAbility'
        type: array
      activity:
        additionalProperties:
          format: float64
          type: number
        type: object
      adds:
        items:
          $ref: '#/definitions/models.RaidAdd'
        type: array
      avoidable:
        items:
          $ref: '#/definitions/models.RaidHits'
        type: array
      boss:
        type: string
      bossPct:
        description: the boss's health left, 0-100; -1 without advanced logging
        type: number
      breaks:
        description: tethers raiders broke, in order
        items:
          $ref: '#/definitions/models.RaidBreak'
        type: array
      casts:
        items:
          $ref: '#/definitions/models.KeyCast'
        type: array
      comparisons:
        $ref: '#/definitions/models.RaidComparisons'
      cooldowns:
        description: raid cooldowns and combat potions, in order
        items:
          $ref: '#/definitions/models.KeyCast'
        type: array
      deaths:
        items:
          $ref: '#/definitions/models.RaidDeath'
        type: array
      debuffs:
        items:
          $ref: '#/definitions/models.KeyDispel'
        type: array
      difficulty:
        enum:
        - LFR
        - Normal
        - Heroic
        - Mythic
        type: string
      dispels:
        description: slowest first
        items:
          $ref: '#/definitions/models.KeyDispel'
        type: array
      durationMS:
        type: integer
      end:
        type: integer
      interrupts:
        description: |-
          The fight's lists as a key has them, for the tabs both pages show: every interrupt, must-stop cast, kick that
          stopped nothing, dispellable debuff, damage spike and survival, potion or crowd-control button pressed, and each
          raider's active time (%); missing in pulls saved before Nov 11.
        items:
          $ref: '#/definitions/models.KeyInterrupt'
        type: array
      kill:
        type: boolean
      lanes:
        items:
          $ref: '#/definitions/models.RaidLane'
        type: array
      lusts:
        description: when Bloodlust landed, ms into the pull
        items:
          type: integer
        type: array
      maps:
        description: the boss's rooms for the replay, from the reference file
        items:
          $ref: '#/definitions/models.RaidMap'
        type: array
      massKills:
        items:
          $ref: '#/definitions/models.MassKill'
        type: array
      meter:
        $ref: '#/definitions/models.KeyMeter'
      missing:
        description: Missing is who lacked a flask, food, Vantus Rune or raid buff
          at the pull's start; missing before Nov 11.
        items:
          $ref: '#/definitions/models.KeyBuffCheck'
        type: array
      night:
        description: 'the raid night: the start''s date, before 6 am counting as the
          day before'
        example: "2026-11-03"
        type: string
      number:
        description: the pull's number on this boss and difficulty tonight, from the
          pulls known when it's read
        type: integer
      phase:
        description: the last phase reached ("P2"); empty for a boss without phase
          triggers
        type: string
      pickups:
        description: what raiders picked up (eggs), each wave in order
        items:
          $ref: '#/definitions/models.RaidPickup'
        type: array
      players:
        items:
          type: string
        type: array
      priority:
        items:
          $ref: '#/definitions/models.RaidPriority'
        type: array
      soaks:
        items:
          $ref: '#/definitions/models.RaidSoak'
        type: array
      spikes:
        items:
          $ref: '#/definitions/models.KeySpike'
        type: array
      stacks:
        items:
          $ref: '#/definitions/models.RaidStacks'
        type: array
      start:
        type: integer
      stops:
        items:
          $ref: '#/definitions/models.KeyStop'
        type: array
      suggestions:
        description: |-
          Suggestions is what to fix on the next pull, most important first, worked out when the pull is read so it's
          compared with the best pull as of then.
        items:
          type: string
        type: array
      taken:
        items:
          $ref: '#/definitions/models.KeyHit'
        type: array
      targets:
        items:
          $ref: '#/definitions/models.RaidTarget'
        type: array
      wastedKicks:
        items:
          $ref: '#/definitions/models.KeyCast'
        type: array
      wentOff:
        description: must-stop casts that finished
        items:
          $ref: '#/definitions/models.KeyStop'
        type: array
    type: object
  models.RaidPullSummary:
    properties:
      boss:
        type: string
      bossPct:
        type: number
      difficulty:
        type: string
      durationMS:
        type: integer
      kill:
        type: boolean
      night:
        type: string
      number:
        type: integer
      phase:
        type: string
      start:
        type: integer
    type: object
  models.RaidSoak:
    properties:
      ability:
        type: string
      casts:
        type: integer
      died:
        items:
          type: string
        type: array
      fewest:
        type: integer
      hits:
        description: missing in pulls saved before Nov 11
        items:
          $ref: '#/definitions/models.RaidSoakCast'
        type: array
      most:
        type: integer
      needed:
        type: integer
    type: object
  models.RaidSoakCast:
    properties:
      clockMS:
        type: integer
      players:
        items:
          type: string
        type: array
    type: object
  models.RaidSpawn:
    properties:
      cause:
        type: string
      clockMS:
        type: integer
      players:
        items:
          type: string
        type: array
    type: object
  models.RaidStacks:
    properties:
      ability:
        type: string
      limit:
        type: integer
      players:
        items:
          $ref: '#/definitions/models.PlayerCount'
        type: array
    type: object
  models.RaidTarget:
    properties:
      damage:
        type: integer
      player:
        type: string
      target:
        type: string
    type: object
  models.ReadyCheck:
    properties:
      dungeon:
        type: string
      players:
        items:
          $ref: '#/definitions/models.ReadyPlayer'
        type: array
      sinceMS:
        type: integer
    type: object
  models.ReadyPlayer:
    properties:
      missing:
        items:
          type: string
        type: array
      notSeen:
        items:
          type: string
        type: array
      player:
        type: string
    type: object
  models.ReviewMetric:
    properties:
      amount:
        description: shown shortened ("2.1M"), else as a whole number
        type: boolean
      help:
        description: what the metric counts, for the page to show on hover
        type: string
      name:
        type: string
      partyRank:
        type: integer
      top:
        type: number
      total:
        description: 'DPS and HPS: the key''s damage or healing in all'
        type: number
      totalName:
        description: 'what Total is: "damage" or "healing"'
        type: string
      usual:
        type: number
      value:
        type: number
    type: object
  models.Settings:
    properties:
      logsDir:
        type: string
      overlay:
        $ref: '#/definitions/models.OverlaySettings'
      region:
        enum:
        - us
        - eu
        - kr
        - tw
        type: string
    type: object
  models.SettingsView:
    properties:
      lastLogMS:
        type: integer
      logsDir:
        type: string
      logsDirFound:
        type: boolean
      minOpacity:
        type: integer
      overlay:
        $ref: '#/definitions/models.OverlaySettings'
      overlayShows:
        items:
          type: string
        type: array
      region:
        enum:
        - us
        - eu
        - kr
        - tw
        type: string
      regions:
        description: Regions are the regions to pick from, OverlayShows when the overlay
          can show, and MinOpacity its least opacity.
        items:
          type: string
        type: array
    type: object
  models.TrackCast:
    properties:
      e:
        type: integer
      s:
        type: string
      t:
        type: integer
      x:
        type: boolean
    type: object
  models.TrackPoint:
    properties:
      hp:
        description: a raid boss's or add's health left (%), 0 when unknown
        type: number
      map:
        type: integer
      name:
        type: string
      t:
        type: integer
      x:
        type: number
      "y":
        type: number
    type: object
  models.UncountedNPC:
    properties:
      deaths:
        type: integer
      name:
        type: string
      npc:
        type: integer
    type: object
info:
  contact: {}
  description: 'The site''s API: the live Mythic+ key read from the combat log.'
  title: WoW Live API
  version: "1"
paths:
  /api/mplus/dungeons/{mapID}/floors/{uiMapID}/tiles/{x}/{y}:
    get:
      parameters:
      - description: the dungeon's map ID (challenge mode ID)
        in: path
        name: mapID
        required: true
        type: integer
      - description: the floor's map ID in the combat log
        in: path
        name: uiMapID
        required: true
        type: integer
      - description: tile column, 0 to 3
        in: path
        name: x
        required: true
        type: integer
      - description: tile row, 0 to 3
        in: path
        name: "y"
        required: true
        type: integer
      produces:
      - image/webp
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "502":
          description: Keystone.guru failed
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: 'One map tile of a dungeon floor (384 by 256 WebP, Keystone.guru''s
        zoom 2: 4 by 4 tiles a floor)'
      tags:
      - mplus
  /api/mplus/dungeons/{mapID}/map:
    get:
      parameters:
      - description: the dungeon's map ID (challenge mode ID)
        in: path
        name: mapID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.DungeonMap'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: 'A dungeon''s map: its floors with Keystone.guru tiles, and where parties
        have walked in its saved runs'
      tags:
      - mplus
  /api/mplus/events:
    get:
      description: |-
        Server-sent events: a "change" event with the keys' new version whenever the running key or the
        saved keys change, at most one every 250 ms, and a comment line every 15 s while nothing does. The
        page then reads the endpoints it shows again.
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.ChangeEvent'
      summary: Notices that the keys changed
      tags:
      - mplus
  /api/mplus/keys:
    delete:
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Delete every saved Mythic+ key
      tags:
      - mplus
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.KeySummary'
            type: array
      summary: The saved Mythic+ keys, newest first
      tags:
      - mplus
  /api/mplus/keys/{start}:
    delete:
      parameters:
      - description: the key's start (ms since the epoch)
        in: path
        name: start
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Delete one saved Mythic+ key
      tags:
      - mplus
    get:
      parameters:
      - description: the key's start (ms since the epoch)
        in: path
        name: start
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.KeyView'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: One saved Mythic+ key
      tags:
      - mplus
  /api/mplus/keys/{start}/review:
    get:
      parameters:
      - description: the key's start (ms since the epoch)
        in: path
        name: start
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.KeyReview'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "503":
          description: no Warcraft Logs credentials
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: A finished key's review, if one was made
      tags:
      - mplus
    post:
      parameters:
      - description: the key's start (ms since the epoch)
        in: path
        name: start
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.KeyReview'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "409":
          description: the key is still running
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "429":
          description: fewer than 100 Warcraft Logs points left this hour
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "502":
          description: Warcraft Logs failed
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "503":
          description: no Warcraft Logs credentials
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Review a finished key against Warcraft Logs' top runs and the players'
        earlier runs (spends points)
      tags:
      - mplus
  /api/mplus/keys/{start}/track:
    get:
      parameters:
      - description: 'the key''s start (ms since the epoch): the running key''s, the
          last one''s or a saved one''s'
        in: path
        name: start
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.KeyTrack'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Where a key's party went and its mobs died, for the map
      tags:
      - mplus
  /api/mplus/live:
    get:
      description: |-
        The key being played (its clock read now, death penalty included) or, between keys, the last one
        that ended. The page reads it again on each notice from /api/mplus/events.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.KeyView'
        "204":
          description: No key in the combat log yet
      summary: The running Mythic+ key, or the last one
      tags:
      - mplus
  /api/mplus/live/abandon:
    post:
      description: |-
        For a party that left a key: the game logs no end for it, and writes the line that says they left
        with its next batch, which can be minutes later. The key ends at its last line and is saved and
        reviewed like any other; if the log goes on in it for 2 more minutes, it runs again.
      responses:
        "204":
          description: No Content
        "409":
          description: no key is running
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: End the running key as abandoned
      tags:
      - mplus
  /api/mplus/ready:
    get:
      description: |-
        While the party is in a Mythic dungeon with no key running: each member's missing flask, food and
        party buffs, and those not seen since the party zoned in (from the combat log, so a buff from before
        logging started there is never seen). Read again on each notice from /api/mplus/events. A raid's is
        in /api/raid/live.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ReadyCheck'
        "204":
          description: Not in a Mythic dungeon between keys
      summary: The ready check before the next key
      tags:
      - mplus
  /api/raid/live:
    get:
      description: |-
        Whether a raid pull is on (its boss and start), the last pull that ended with its deaths,
        mechanics, meters and cooldowns, compared with tonight's best and the best ever on the boss, and in
        a raid between pulls the ready check (ready). The page reads it again on each notice from
        /api/mplus/events.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RaidLive'
      summary: 'The raid now: a pull on, and the last pull'
      tags:
      - raid
  /api/raid/maps/{uiMapID}:
    get:
      description: 'Placed by the pull''s maps (models.RaidMap): its left edge is
        maxY, its top maxX.'
      parameters:
      - description: the room's map ID in the combat log
        in: path
        name: uiMapID
        required: true
        type: integer
      produces:
      - image/png
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "502":
          description: Warcraft Logs failed
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: A raid room's map image (the game's map art, as Warcraft Logs' replay
        draws it)
      tags:
      - raid
  /api/raid/nights:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: newest night first, each night's pulls newest first
          schema:
            items:
              $ref: '#/definitions/models.RaidNight'
            type: array
      summary: Every raid night's pulls
      tags:
      - raid
  /api/raid/pulls/{start}:
    get:
      parameters:
      - description: the pull's start (ms since the epoch)
        in: path
        name: start
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RaidPull'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: One raid pull
      tags:
      - raid
  /api/raid/pulls/{start}/track:
    get:
      description: |-
        Each raider's position about once a second, the boss's units' and the adds to burst with their
        health (hp) and which the health box shows (health), killed adds' last places, each raider's
        damage, healing and damage taken so far about every 2 s, their casts, and what each ability did in
        each 10 s stretch (abilities, abilityTimes), on the pull's clock.
      parameters:
      - description: the pull's start (ms since the epoch)
        in: path
        name: start
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.KeyTrack'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: One raid pull's replay track
      tags:
      - raid
  /api/settings:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SettingsView'
      summary: The desktop app's settings
      tags:
      - settings
    put:
      consumes:
      - application/json
      description: |-
        The log folder and the overlay change right away; a new region's affix names show from the next
        start.
      parameters:
      - description: the settings
        in: body
        name: settings
        required: true
        schema:
          $ref: '#/definitions/models.Settings'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SettingsView'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Save the desktop app's settings
      tags:
      - settings
  /api/settings/read-keys:
    post:
      description: |-
        Reads the combat logs in the folder that are new or changed since the last read (all=true: every
        one) and saves each finished key and raid pull, so the estimate and the best pulls have earlier runs
        to go on. Reading 3 GB of logs takes about 10 s.
      parameters:
      - description: read every log again, even ones already read
        in: query
        name: all
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.OldKeys'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Save the keys and raid pulls already in the log folder
      tags:
      - settings
  /api/settings/warcraftlogs:
    delete:
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Remove the saved Warcraft Logs keys
      tags:
      - settings
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.KeyStatus'
      summary: Whether Warcraft Logs keys are saved, and their last test (never the
        secret)
      tags:
      - settings
    put:
      consumes:
      - application/json
      description: |-
        Gets a token and reads the points left this hour, then saves the keys in Windows Credential
        Manager. With force=true they're saved even when the test fails.
      parameters:
      - description: the client ID and secret
        in: body
        name: keys
        required: true
        schema:
          $ref: '#/definitions/models.Credentials'
      - description: save even if the test fails
        in: query
        name: force
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.KeyStatus'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "422":
          description: Warcraft Logs turned the keys down
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Windows Credential Manager failed
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "502":
          description: Warcraft Logs couldn't be reached
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Test and save the Warcraft Logs client ID and secret
      tags:
      - settings
  /api/settings/warcraftlogs/test:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.KeyStatus'
        "404":
          description: No keys saved
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "422":
          description: Warcraft Logs turned the keys down
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "502":
          description: Warcraft Logs couldn't be reached
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Test the saved Warcraft Logs keys again
      tags:
      - settings
swagger: "2.0"

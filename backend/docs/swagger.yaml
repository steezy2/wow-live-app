basePath: /
definitions:
  controller.ChangeEvent:
    properties:
      version:
        type: integer
    type: object
  controller.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  controller.ImportKinds:
    properties:
      kinds:
        items:
          $ref: '#/definitions/models.ImportKind'
        minItems: 1
        type: array
        uniqueItems: true
    required:
    - kinds
    type: object
  controller.LogNames:
    properties:
      names:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - names
    type: object
  controller.OldKeys:
    properties:
      read:
        type: integer
      saved:
        type: integer
    type: object
  models.AbilitySeries:
    properties:
      a:
        type: string
      p:
        description: '[end clockMS, damage, healing, damage taken]'
        items:
          items:
            format: int64
            type: integer
          type: array
        type: array
    type: object
  models.Affix:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  models.CharacterParse:
    properties:
      best:
        type: number
      encounter:
        type: string
      kind:
        allOf:
        - $ref: '#/definitions/models.FightKind'
        enum:
        - mplus
        - raid
      median:
        type: number
      runs:
        type: integer
      spec:
        type: string
    type: object
  models.CharacterParses:
    properties:
      found:
        type: boolean
      parses:
        items:
          $ref: '#/definitions/models.CharacterParse'
        type: array
      url:
        type: string
    type: object
  models.Credentials:
    properties:
      id:
        type: string
      secret:
        type: string
    type: object
  models.DungeonFloor:
    properties:
      maxX:
        type: number
      maxY:
        type: number
      minX:
        type: number
      minY:
        type: number
      tiles:
        type: string
      uiMapID:
        type: integer
    type: object
  models.DungeonMap:
    properties:
      floors:
        items:
          $ref: '#/definitions/models.DungeonFloor'
        type: array
      walked:
        items:
          $ref: '#/definitions/models.TrackPoint'
        type: array
    type: object
  models.FightKind:
    enum:
    - mplus
    - raid
    type: string
    x-enum-varnames:
    - FightMPlus
    - FightRaid
  models.ForcesPace:
    properties:
      bestPct:
        type: number
      fasterPct:
        type: number
    type: object
  models.ForcesPoint:
    properties:
      clockMS:
        type: integer
      pct:
        type: number
    type: object
  models.ImportKind:
    enum:
    - keys
    - raidKills
    - raidWipes
    type: string
    x-enum-varnames:
    - ImportKeys
    - ImportRaidKills
    - ImportRaidWipes
  models.ImportKindPlan:
    properties:
      default:
        type: boolean
      fights:
        type: integer
      kind:
        $ref: '#/definitions/models.ImportKind'
      minutes:
        type: integer
      points:
        type: number
    type: object
  models.ImportPlan:
    properties:
      character:
        type: string
      kinds:
        items:
          $ref: '#/definitions/models.ImportKindPlan'
        type: array
      listedPoints:
        type: number
      pointsPerHour:
        type: number
    type: object
  models.ImportStatus:
    properties:
      character:
        type: string
      fights:
        type: integer
      fightsDone:
        type: integer
      fightsFailed:
        type: integer
      imported:
        type: integer
      linked:
        description: Linked is how many saved keys and pulls read from local logs
          the last listing linked to their report.
        type: integer
      plan:
        $ref: '#/definitions/models.ImportPlan'
      pointsPerFight:
        type: number
      pointsSpent:
        type: number
      problem:
        type: string
      reservePoints:
        description: |-
          ReservePoints are the hour's points an import leaves for key reviews and parses: with fewer left, it waits
          for the hour to reset.
        type: number
      resumeAtMS:
        type: integer
      state:
        enum:
        - idle
        - listing
        - running
        - waiting
        - done
        - failed
        type: string
    type: object
  models.KeyAbility:
    properties:
      ability:
        type: string
      casts:
        type: integer
      damage:
        type: integer
      healing:
        type: integer
      hits:
        type: integer
      player:
        type: string
      school:
        type: integer
    type: object
  models.KeyBoss:
    properties:
      endMS:
        type: integer
      kill:
        type: boolean
      name:
        type: string
      startMS:
        type: integer
    type: object
  models.KeyBuffCheck:
    properties:
      missing:
        items:
          type: string
        type: array
      player:
        type: string
    type: object
  models.KeyCast:
    properties:
      ability:
        type: string
      clockMS:
        type: integer
      endMS:
        description: 'a raid cooldown: when its buff last left a raider (0 when none
          was seen to)'
        type: integer
      kind:
        enum:
        - defensive
        - healthstone
        - health potion
        - combat potion
        - kick
        - cc
        - raid cooldown
        type: string
      player:
        type: string
      prepot:
        description: a combat potion drunk before the run started
        type: boolean
    type: object
  models.KeyDeath:
    properties:
      ability:
        type: string
      clockMS:
        type: integer
      defensive:
        type: string
      killer:
        type: string
      player:
        type: string
      ready:
        items:
          type: string
        type: array
      used:
        description: they pressed Defensive themselves
        type: boolean
    type: object
  models.KeyDispel:
    properties:
      afterMS:
        type: integer
      by:
        type: string
      clockMS:
        type: integer
      player:
        type: string
      spell:
        type: string
    type: object
  models.KeyForces:
    properties:
      at:
        items:
          $ref: '#/definitions/models.ForcesPoint'
        type: array
      count:
        type: integer
      needsCheck:
        type: boolean
      pace:
        $ref: '#/definitions/models.ForcesPace'
      pct:
        type: number
      total:
        type: integer
      uncounted:
        items:
          $ref: '#/definitions/models.UncountedNPC'
        type: array
    type: object
  models.KeyGhost:
    properties:
      killMS:
        type: integer
      name:
        type: string
      needByMS:
        type: integer
    type: object
  models.KeyHit:
    properties:
      ability:
        type: string
      damage:
        type: integer
      hits:
        description: direct hits; 0 in keys saved before Nov 9
        type: integer
      player:
        type: string
      school:
        type: integer
    type: object
  models.KeyInterrupt:
    properties:
      clockMS:
        type: integer
      kick:
        description: the player's spell that did it ("Wind Shear"); empty in keys
          saved before Nov 8
        type: string
      player:
        type: string
      spell:
        type: string
      target:
        type: string
    type: object
  models.KeyMeter:
    properties:
      endMS:
        type: integer
      ongoing:
        description: the pull is still being fought (no pullGapMS pause yet)
        type: boolean
      rows:
        items:
          $ref: '#/definitions/models.KeyMeterRow'
        type: array
      startMS:
        type: integer
    type: object
  models.KeyMeterRow:
    properties:
      avoidable:
        type: integer
      class:
        description: '"Mage", "DeathKnight"; "" when unknown'
        type: string
      damage:
        type: integer
      damageTaken:
        type: integer
      dispels:
        type: integer
      dps:
        type: number
      healing:
        type: integer
      hps:
        type: number
      interrupts:
        type: integer
      player:
        type: string
      priorityDamage:
        description: damage into trash pulls' minibosses and into bosses
        type: integer
      purges:
        type: integer
    type: object
  models.KeyMiniboss:
    properties:
      diedMS:
        type: integer
      name:
        type: string
      of:
        type: integer
      order:
        type: integer
    type: object
  models.KeyProjection:
    properties:
      best:
        items:
          $ref: '#/definitions/models.KeyGhost'
        type: array
      chests:
        type: integer
      finalMS:
        type: integer
      highMS:
        type: integer
      lowMS:
        type: integer
      odds:
        items:
          type: number
        type: array
      runs:
        type: integer
      source:
        description: '"3 of your runs, forces and bosses"'
        type: string
    type: object
  models.KeyPull:
    properties:
      clockMS:
        type: integer
      healthPct:
        type: number
      late:
        type: boolean
      minibosses:
        items:
          $ref: '#/definitions/models.KeyMiniboss'
        type: array
      openingPct:
        type: number
      priorityPct:
        type: number
      pull:
        type: integer
    type: object
  models.KeyReview:
    properties:
      baseline:
        type: string
      end:
        type: integer
      notes:
        description: 'the party as a whole: deaths'' cost, must-stop casts, time between
          pulls'
        items:
          type: string
        type: array
      party:
        type: string
      players:
        items:
          $ref: '#/definitions/models.PlayerReview'
        type: array
      points:
        type: number
      start:
        type: integer
      topBosses:
        additionalProperties:
          format: int64
          type: integer
        description: |-
          TopBosses is how long each boss took in the similar top runs (the median, by boss name; missing in reviews
          saved before Nov 11).
        type: object
    type: object
  models.KeySpike:
    properties:
      causes:
        description: |-
          Causes is what hit the party hardest in it, most damage first (at most three); missing in keys saved
          before Nov 12.
        items:
          $ref: '#/definitions/models.SpikeCause'
        type: array
      clockMS:
        type: integer
      damage:
        type: integer
      members:
        items:
          $ref: '#/definitions/models.KeySpikeMember'
        type: array
      overlap:
        type: boolean
      partyCDs:
        items:
          type: string
        type: array
      seconds:
        type: integer
      unused:
        description: |-
          Unused is the defensive the member hit hardest had ready and didn't use ("" when they used one or had none
          ready); missing in keys saved before Nov 11.
        type: string
    type: object
  models.KeySpikeMember:
    properties:
      defensive:
        type: string
      player:
        type: string
      ready:
        items:
          type: string
        type: array
      taken:
        type: integer
      used:
        description: they pressed Defensive themselves
        type: boolean
    type: object
  models.KeyStatus:
    properties:
      idEnd:
        type: string
      limitPerHour:
        type: number
      pointsLeft:
        type: number
      problem:
        type: string
      set:
        type: boolean
      testedMS:
        type: integer
      works:
        type: boolean
    type: object
  models.KeyStop:
    properties:
      by:
        type: string
      clockMS:
        type: integer
      intoMS:
        type: integer
      mob:
        type: string
      outcome:
        enum:
        - interrupted
        - stopped
        - went off
        - died
        type: string
      pull:
        type: integer
      spell:
        type: string
    type: object
  models.KeySummary:
    properties:
      chests:
        type: integer
      dungeon:
        type: string
      finalMS:
        type: integer
      imported:
        type: boolean
      level:
        type: integer
      report:
        allOf:
        - $ref: '#/definitions/models.ReportLink'
        description: |-
          Report is the Warcraft Logs fight the key is, when one is known (imported, or matched to a report), and
          Imported marks a key built from it instead of a local combat log.
      start:
        type: integer
      status:
        type: string
    type: object
  models.KeyTrack:
    properties:
      abilities:
        additionalProperties:
          items:
            $ref: '#/definitions/models.AbilitySeries'
          type: array
        type: object
      abilityTimes:
        description: 'AbilityTimes is when Abilities'' stretches ended, in order:
          a stretch starts where the one before it ended.'
        items:
          type: integer
        type: array
      bosses:
        additionalProperties:
          items:
            $ref: '#/definitions/models.TrackPoint'
          type: array
        description: |-
          Bosses is a raid boss's units and the adds to burst (by GUID, each point named, with its health) about once a
          second; a raid pull's or a key's, once it has ended.
        type: object
      casts:
        additionalProperties:
          items:
            $ref: '#/definitions/models.TrackCast'
          type: array
        description: |-
          Casts is each raider's casts in order, and Abilities what each one's abilities did in each abilityEveryMS
          stretch, so the replay shows what a raider was casting and their bars up to its moment; none in pulls saved
          before Nov 11.
        type: object
      classes:
        additionalProperties:
          type: string
        type: object
      deaths:
        items:
          $ref: '#/definitions/models.TrackPoint'
        type: array
      health:
        description: |-
          Health is the Bosses GUIDs the replay's health box shows: the units whose health is the boss's, then the adds
          to burst.
        items:
          type: string
        type: array
      meters:
        additionalProperties:
          items:
            $ref: '#/definitions/models.MeterPoint'
          type: array
        description: each player's damage and healing so far, about every 2 s
        type: object
      mobs:
        additionalProperties:
          $ref: '#/definitions/models.MobTrail'
        description: |-
          Mobs is every other hostile mob (by GUID) the replay draws as a small dot: about every 2 s while it acts, and
          when it died; none in tracks saved before Nov 11.
        type: object
      players:
        additionalProperties:
          items:
            $ref: '#/definitions/models.TrackPoint'
          type: array
        type: object
      pulls:
        description: each pull, in order; missing in keys saved before Nov 8
        items:
          $ref: '#/definitions/models.PullSpan'
        type: array
      targetSeries:
        additionalProperties:
          items:
            $ref: '#/definitions/models.AbilitySeries'
          type: array
        description: TargetSeries is each raider's damage into each enemy (by name,
          as Ability) in the same stretches.
        type: object
    type: object
  models.KeyView:
    properties:
      abilities:
        description: |-
          Abilities is each player's damage, healing and casts by ability, and Taken their damage taken by ability, most
          first: there once the key is over, and missing in keys saved before Nov 10.
        items:
          $ref: '#/definitions/models.KeyAbility'
        type: array
      activity:
        additionalProperties:
          format: float64
          type: number
        description: Activity is each player's share of their time alive in pulls
          with a cast going or a hit landing (in %).
        type: object
      affixes:
        items:
          $ref: '#/definitions/models.Affix'
        type: array
      avoidableHits:
        description: AvoidableHits is each player's avoidable damage by ability, most
          first.
        items:
          $ref: '#/definitions/models.KeyHit'
        type: array
      bestBosses:
        additionalProperties:
          format: int64
          type: integer
        type: object
      bestFinalMS:
        description: BestFinalMS is the best other timed run's time, for the pace
          line under the result.
        type: integer
      betweenPulls:
        description: BetweenPulls is the time between each pull and the one before
          it (from the second pull), on the key's clock.
        items:
          type: integer
        type: array
      bosses:
        items:
          $ref: '#/definitions/models.KeyBoss'
        type: array
      buffs:
        items:
          $ref: '#/definitions/models.KeyBuffCheck'
        type: array
      casts:
        items:
          $ref: '#/definitions/models.KeyCast'
        type: array
      chests:
        type: integer
      clockMS:
        type: integer
      deaths:
        items:
          $ref: '#/definitions/models.KeyDeath'
        type: array
      debuffs:
        description: dispellable debuffs on the party and how fast they came off
        items:
          $ref: '#/definitions/models.KeyDispel'
        type: array
      dungeon:
        type: string
      end:
        type: integer
      finalMS:
        description: the game's own time for the key, once it ends
        type: integer
      forces:
        allOf:
        - $ref: '#/definitions/models.KeyForces'
        description: nil when the dungeon file doesn't have the dungeon
      imported:
        description: Imported marks a key built from a Warcraft Logs report instead
          of a local combat log.
        type: boolean
      interrupts:
        items:
          $ref: '#/definitions/models.KeyInterrupt'
        type: array
      lanes:
        description: |-
          Lanes is the key's timeline for the replay (see keyLanes), and Suggestions what to fix next key, worked out when
          the key is read (see keySuggestions); both empty in keys saved before Nov 11.
        items:
          $ref: '#/definitions/models.RaidLane'
        type: array
      lastPull:
        $ref: '#/definitions/models.KeyMeter'
      level:
        type: integer
      logger:
        description: Logger is the party member whose game wrote the log ("" in keys
          saved before Nov 11).
        type: string
      lusts:
        description: Lusts is when the party got Bloodlust or a copy, on the key's
          clock.
        items:
          type: integer
        type: array
      mapID:
        type: integer
      overall:
        $ref: '#/definitions/models.KeyMeter'
      penaltyMS:
        type: integer
      players:
        items:
          type: string
        type: array
      plus2MS:
        type: integer
      plus3MS:
        type: integer
      projection:
        $ref: '#/definitions/models.KeyProjection'
      pulls:
        description: Pulls is each pull that had priority mobs, in order.
        items:
          $ref: '#/definitions/models.KeyPull'
        type: array
      reference:
        description: reference/mplus-dungeons.json has the dungeon (avoidable list,
          forces)
        type: boolean
      report:
        allOf:
        - $ref: '#/definitions/models.ReportLink'
        description: Report is the Warcraft Logs fight this key is, when one is known
          (imported, or matched to a report).
      silentMS:
        description: |-
          SilentMS is how long ago the last line of a running key was logged (0 once it's over). The game writes its log
          in batches as fights start and end, so a long silence is a long fight, or a party that left.
        type: integer
      specs:
        additionalProperties:
          type: integer
        description: player -> specialization ID, from COMBATANT_INFO
        type: object
      spikes:
        description: the worst bursts of party damage taken, worst first
        items:
          $ref: '#/definitions/models.KeySpike'
        type: array
      start:
        type: integer
      status:
        enum:
        - running
        - timed
        - depleted
        - abandoned
        type: string
      stops:
        description: must-stop casts and what happened to each
        items:
          $ref: '#/definitions/models.KeyStop'
        type: array
      suggestions:
        items:
          type: string
        type: array
      taken:
        items:
          $ref: '#/definitions/models.KeyHit'
        type: array
      timerMS:
        description: the dungeon's time limit; 0 when Raider.IO doesn't list it
        type: integer
      wastedKicks:
        description: kicks that interrupted nothing
        items:
          $ref: '#/definitions/models.KeyCast'
        type: array
    type: object
  models.LogFile:
    properties:
      active:
        description: 'the game may still write it: it can''t be archived'
        type: boolean
      archived:
        type: boolean
      bytes:
        type: integer
      error:
        description: why the last archive or delete of it failed
        type: string
      keys:
        description: saved keys that started in it
        type: integer
      name:
        description: the log's file name (an archived one without .zip)
        type: string
      pulls:
        description: saved raid pulls that started in it
        type: integer
      read:
        description: read by the current reader (Read old logs), so archiving loses
          nothing
        type: boolean
      suggested:
        description: 'ticked at first: old, read and not active'
        type: boolean
      writtenMS:
        description: last written (Unix ms)
        type: integer
    type: object
  models.MassKill:
    properties:
      ability:
        type: string
      clockMS:
        type: integer
      killed:
        type: integer
    type: object
  models.MeterPoint:
    properties:
      av:
        type: integer
      d:
        type: integer
      ds:
        type: integer
      h:
        type: integer
      k:
        type: integer
      pd:
        type: integer
      t:
        type: integer
      tk:
        description: damage taken so far; 0 in keys saved before Nov 8
        type: integer
    type: object
  models.MobTrail:
    properties:
      died:
        type: integer
      p:
        items:
          $ref: '#/definitions/models.TrackPoint'
        type: array
    type: object
  models.OverlaySettings:
    properties:
      clickThrough:
        description: |-
          ClickThrough lets clicks on the overlay through to the game; off (the default), a click on a player's row
          shows their abilities in the pull.
        type: boolean
      opacity:
        maximum: 100
        minimum: 0
        type: integer
      show:
        enum:
        - keys
        - always
        - "off"
        type: string
      split:
        description: Split shows the pull and the whole key as two cards, one above
          the other, instead of one card.
        type: boolean
    type: object
  models.PlayerCount:
    properties:
      count:
        type: integer
      player:
        type: string
    type: object
  models.PlayerReview:
    properties:
      advice:
        items:
          type: string
        type: array
      metrics:
        items:
          $ref: '#/definitions/models.ReviewMetric'
        type: array
      player:
        type: string
      positive:
        type: string
      spec:
        description: the spec and class, as the page shows them
        example: Blood Death Knight
        type: string
    type: object
  models.PullSpan:
    properties:
      endMS:
        type: integer
      startMS:
        type: integer
    type: object
  models.RaidAdd:
    properties:
      aliveEnd:
        type: integer
      killed:
        type: integer
      longestMS:
        type: integer
      name:
        type: string
      spawned:
        type: integer
      spawns:
        description: |-
          Spawns is each one's appearance and its cause, for adds the reference says how they spawn; missing in pulls
          saved before Nov 11.
        items:
          $ref: '#/definitions/models.RaidSpawn'
        type: array
    type: object
  models.RaidBreak:
    properties:
      aura:
        type: string
      clockMS:
        type: integer
      effect:
        type: string
      hit:
        type: integer
      player:
        type: string
      then:
        items:
          type: string
        type: array
    type: object
  models.RaidComparisons:
    properties:
      ever:
        $ref: '#/definitions/models.RaidPullSummary'
      tonight:
        $ref: '#/definitions/models.RaidPullSummary'
    type: object
  models.RaidDeath:
    properties:
      ability:
        type: string
      clockMS:
        type: integer
      defensive:
        type: string
      early:
        type: boolean
      killer:
        type: string
      player:
        type: string
      ready:
        items:
          type: string
        type: array
      recap:
        description: the last hits before the death, oldest first
        items:
          $ref: '#/definitions/models.RaidHit'
        type: array
      used:
        description: they pressed Defensive themselves
        type: boolean
    type: object
  models.RaidHit:
    properties:
      ability:
        type: string
      amount:
        type: integer
      beforeMS:
        type: integer
      source:
        type: string
    type: object
  models.RaidHits:
    properties:
      ability:
        type: string
      players:
        items:
          $ref: '#/definitions/models.PlayerCount'
        type: array
    type: object
  models.RaidLane:
    properties:
      kind:
        enum:
        - pulls
        - bosses
        - phases
        - deaths
        - lust
        - cooldowns
        - potions
        - spike
        - stops
        - cc
        - avoidable
        - soak
        - pickups
        - stacks
        - adds
        type: string
      marks:
        items:
          $ref: '#/definitions/models.RaidMark'
        type: array
      name:
        type: string
    type: object
  models.RaidLive:

    type: object
  models.TrackCast:
    properties:
      e:
        type: integer
      s:
        type: string
      t:
        type: integer
      x:
        type: boolean
    type: object
  models.TrackPoint:
    properties:
      hp:
        description: a raid boss's or add's health left (%), 0 when unknown
        type: number
      map:
        type: integer
      name:
        type: string
      t:
        type: integer
      x:
        type: number
      "y":
        type: number
    type: object
  models.UncountedNPC:
    properties:
      deaths:
        type: integer
      name:
        type: string
      npc:
        type: integer
    type: object
info:
  contact: {}
  description: 'The site''s API: the live Mythic+ key read from the combat log.'
  title: WoW Live API
  version: "1"
paths:
  /api/mplus/dungeons/{mapID}/floors/{uiMapID}/tiles/{x}/{y}:
    get:
      parameters:
      - description: the dungeon's map ID (challenge mode ID)
        in: path
        name: mapID
        required: true
        type: integer
      - description: the floor's map ID in the combat log
        in: path
        name: uiMapID
        required: true
        type: integer
      - description: tile column, 0 to 3
        in: path
        name: x
        required: true
        type: integer
      - description: tile row, 0 to 3
        in: path
        name: "y"
        required: true
        type: integer
      produces:
      - image/webp
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "502":
          description: Keystone.guru failed
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: 'One map tile of a dungeon floor (384 by 256 WebP, Keystone.guru''s
        zoom 2: 4 by 4 tiles a floor)'
      tags:
      - mplus
  /api/mplus/dungeons/{mapID}/map:
    get:
      parameters:
      - description: the dungeon's map ID (challenge mode ID)
        in: path
        name: mapID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.DungeonMap'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: 'A dungeon''s map: its floors with Keystone.guru tiles, and where parties
        have walked in its saved runs'
      tags:
      - mplus
  /api/mplus/events:
    get:
      description: |-
        Server-sent events: a "change" event with the keys' new version whenever the running key or the
        saved keys change, at most one every 250 ms, and a comment line every 15 s while nothing does. The
        page then reads the endpoints it shows again.
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.ChangeEvent'
      summary: Notices that the keys changed
      tags:
      - mplus
  /api/mplus/keys:
    delete:
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Delete every saved Mythic+ key
      tags:
      - mplus
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.KeySummary'
            type: array
      summary: The saved Mythic+ keys, newest first
      tags:
      - mplus
  /api/mplus/keys/{start}:
    delete:
      parameters:
      - description: the key's start (ms since the epoch)
        in: path
        name: start
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Delete one saved Mythic+ key
      tags:
      - mplus
    get:
      parameters:
      - description: the key's start (ms since the epoch)
        in: path
        name: start
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.KeyView'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: One saved Mythic+ key
      tags:
      - mplus
  /api/mplus/keys/{start}/review:
    get:
      parameters:
      - description: the key's start (ms since the epoch)
        in: path
        name: start
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.KeyReview'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "503":
          description: no Warcraft Logs credentials
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: A finished key's review, if one was made
      tags:
      - mplus
    post:
      parameters:
      - description: the key's start (ms since the epoch)
        in: path
        name: start
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.KeyReview'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "409":
          description: the key is still running
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "429":
          description: fewer than 100 Warcraft Logs points left this hour
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "502":
          description: Warcraft Logs failed
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "503":
          description: no Warcraft Logs credentials
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Review a finished key against Warcraft Logs' top runs and the players'
        earlier runs (spends points)
      tags:
      - mplus
  /api/mplus/keys/{start}/track:
    get:
      parameters:
      - description: 'the key''s start (ms since the epoch): the running key''s, the
          last one''s or a saved one''s'
        in: path
        name: start
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.KeyTrack'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Where a key's party went and its mobs died, for the map
      tags:
      - mplus
  /api/mplus/live:
    get:
      description: |-
        The key being played (its clock read now, death penalty included) or, between keys, the last one
        that ended. The page reads it again on each notice from /api/mplus/events.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.KeyView'
        "204":
          description: No key in the combat log yet
      summary: The running Mythic+ key, or the last one
      tags:
      - mplus
  /api/mplus/live/abandon:
    post:
      description: |-
        For a party that left a key: the game logs no end for it, and writes the line that says they left
        with its next batch, which can be minutes later. The key ends at its last line and is saved and
        reviewed like any other; if the log goes on in it for 2 more minutes, it runs again.
      responses:
        "204":
          description: No Content
        "409":
          description: no key is running
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: End the running key as abandoned
      tags:
      - mplus
  /api/mplus/ready:
    get:
      description: |-
        While the party is in a Mythic dungeon with no key running: each member's missing flask, food and
        party buffs, and those not seen since the party zoned in (from the combat log, so a buff from before
        logging started there is never seen). Read again on each notice from /api/mplus/events. A raid's is
        in /api/raid/live.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ReadyCheck'
        "204":
          description: Not in a Mythic dungeon between keys
      summary: The ready check before the next key
      tags:
      - mplus
  /api/raid/live:
    get:
      description: |-
        Whether a raid pull is on (its boss and start), the last pull that ended with its deaths,
        mechanics, meters and cooldowns, compared with tonight's best and the best ever on the boss, and in
        a raid between pulls the ready check (ready). The page reads it again on each notice from
        /api/mplus/events.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RaidLive'
      summary: 'The raid now: a pull on, and the last pull'
      tags:
      - raid
  /api/raid/maps/{uiMapID}:
    get:
      description: 'Placed by the pull''s maps (models.RaidMap): its left edge is
        maxY, its top maxX.'
      parameters:
      - description: the room's map ID in the combat log
        in: path
        name: uiMapID
        required: true
        type: integer
      produces:
      - image/png
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "502":
          description: Warcraft Logs failed
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: A raid room's map image (the game's map art, as Warcraft Logs' replay
        draws it)
      tags:
      - raid
  /api/raid/nights:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: newest night first, each night's pulls newest first
          schema:
            items:
              $ref: '#/definitions/models.RaidNight'
            type: array
      summary: Every raid night's pulls
      tags:
      - raid
  /api/raid/pulls/{start}:
    get:
      parameters:
      - description: the pull's start (ms since the epoch)
        in: path
        name: start
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RaidPull'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: One raid pull
      tags:
      - raid
  /api/raid/pulls/{start}/track:
    get:
      description: |-
        Each raider's position about once a second, the boss's units' and the adds to burst with their
        health (hp) and which the health box shows (health), killed adds' last places, each raider's
        damage, healing and damage taken so far about every 2 s, their casts, and what each ability did in
        each 2 s stretch (abilities, abilityTimes), on the pull's clock.
      parameters:
      - description: the pull's start (ms since the epoch)
        in: path
        name: start
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.KeyTrack'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: One raid pull's replay track
      tags:
      - raid
  /api/recap:
    get:
      description: |-
        The keys run and timed, the highest timed level, the time in keys and the deaths; each dungeon's
        runs; your character (whose game wrote most of the logs): specs, median DPS or HPS per dungeon and
        what killed you; who you ran with most; a few facts, each opening its key; and the raid by boss.
        Read from the saved keys and pulls only: no Warcraft Logs points.
      parameters:
      - description: the period's start, ms since the epoch
        in: query
        name: from
        required: true
        type: integer
      - description: the period's end, ms since the epoch (excluded); after from
        in: query
        name: to
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Recap'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: A period's keys and raid pulls as a story
      tags:
      - recap
  /api/recap/periods:
    get:
      description: |-
        This month, last month, this Mythic+ season (from Raider.IO; left out when it can't be reached),
        this year and all time, each with its span to pass to /api/recap.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.RecapPeriod'
            type: array
      summary: The periods a recap covers
      tags:
      - recap
  /api/settings:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SettingsView'
      summary: The desktop app's settings
      tags:
      - settings
    put:
      consumes:
      - application/json
      description: |-
        The log folder and the overlay change right away; a new region's affix names show from the next
        start. A character ("Name-Realm", empty for none) needs a name of 2 to 12 letters and a realm Warcraft
        Logs lists in the region, which takes the saved Warcraft Logs keys.
      parameters:
      - description: the settings
        in: body
        name: settings
        required: true
        schema:
          $ref: '#/definitions/models.Settings'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SettingsView'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: A character needs saved Warcraft Logs keys
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "502":
          description: Warcraft Logs couldn't be reached to check the character
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Save the desktop app's settings
      tags:
      - settings
  /api/settings/logs:
    get:
      description: |-
        The log folder's combat logs, then the ones archived (zipped into its WoW Live archive folder), newest
        first: size, last write, saved keys and pulls from each, whether it's read, whether the game may still
        write it (it can't be archived) and whether to tick it at first (older than 14 days and read).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.LogFile'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: List the combat logs and the archived ones
      tags:
      - settings
  /api/settings/logs/archive:
    delete:
      consumes:
      - application/json
      description: |-
        Removes the named archived logs' zips. Saved keys and pulls stay. Answers the new list; a log that
        couldn't be deleted carries its error.
      parameters:
      - description: names of archived logs from the list
        in: body
        name: logs
        required: true
        schema:
          $ref: '#/definitions/controller.LogNames'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.LogFile'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "409":
          description: already reading, archiving or deleting logs
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Delete archived combat logs for good
      tags:
      - settings
    post:
      consumes:
      - application/json
      description: |-
        Zips each named log into the log folder's WoW Live archive folder and removes it (reading the folder
        first when one isn't read yet), so live reading and Read old logs skip it; Read everything again
        still reads it. Answers the new list; a log that couldn't be archived carries its error.
      parameters:
      - description: names from the list, not archived and not being written
        in: body
        name: logs
        required: true
        schema:
          $ref: '#/definitions/controller.LogNames'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.LogFile'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "409":
          description: already reading, archiving or deleting logs
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Archive combat logs
      tags:
      - settings
  /api/settings/read-keys:
    post:
      description: |-
        Reads the combat logs in the folder that are new or changed since the last read (all=true: every
        one) and saves each finished key and raid pull, so the estimate and the best pulls have earlier runs
        to go on. Reading 3 GB of logs takes about 10 s.
      parameters:
      - description: read every log again, even ones already read
        in: query
        name: all
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.OldKeys'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "409":
          description: already reading, archiving or deleting logs
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Save the keys and raid pulls already in the log folder
      tags:
      - settings
  /api/settings/warcraftlogs:
    delete:
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Remove the saved Warcraft Logs keys
      tags:
      - settings
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.KeyStatus'
      summary: Whether Warcraft Logs keys are saved, and their last test (never the
        secret)
      tags:
      - settings
    put:
      consumes:
      - application/json
      description: |-
        Gets a token and reads the points left this hour, then saves the keys in Windows Credential
        Manager. With force=true they're saved even when the test fails.
      parameters:
      - description: the client ID and secret
        in: body
        name: keys
        required: true
        schema:
          $ref: '#/definitions/models.Credentials'
      - description: save even if the test fails
        in: query
        name: force
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.KeyStatus'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "422":
          description: Warcraft Logs turned the keys down
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "500":
          description: Windows Credential Manager failed
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "502":
          description: Warcraft Logs couldn't be reached
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Test and save the Warcraft Logs client ID and secret
      tags:
      - settings
  /api/settings/warcraftlogs/import:
    delete:
      description: What it fetched stays, so the next import goes on from there.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ImportStatus'
      summary: Stop the import of Warcraft Logs reports
      tags:
      - settings
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ImportStatus'
      summary: How the import of the character's Warcraft Logs reports stands
      tags:
      - settings
    post:
      consumes:
      - application/json
      description: |-
        Lists the reports the settings' character is in, then in the background fetches each Mythic+ key and
        raid boss pull of the kinds sent, of the current season and raid, not saved yet (a key or pull read
        from a local log is skipped) and saves it, tagged with its report. It waits for the hour's points
        when they run low, and goes on after a restart.
      parameters:
      - description: the kinds of fight to import
        in: body
        name: kinds
        required: true
        schema:
          $ref: '#/definitions/controller.ImportKinds'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/models.ImportStatus'
        "400":
          description: No character, one that doesn't fit, or no or unknown kinds
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: No Warcraft Logs keys saved
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "409":
          description: An import is running
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "502":
          description: Warcraft Logs couldn't be reached
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Import the character's Warcraft Logs reports of this season
      tags:
      - settings
  /api/settings/warcraftlogs/import/plan:
    post:
      description: |-
        In the background, lists the reports the settings' character is in (about 2 points a report the
        first time, then only new reports; the list is reused for 10 minutes) and counts the fights an
        import would fetch by kind (Mythic+ keys, raid kills, raid wipes), with their minutes and an
        estimate of their points: the status's plan once its state leaves listing. DELETE on the import
        stops it. A POST, since listing spends points.
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/models.ImportStatus'
        "400":
          description: No character, or one that doesn't fit
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: No Warcraft Logs keys saved
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "409":
          description: An import or a search is running
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "502":
          description: Warcraft Logs couldn't be reached
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: List the fights an import of the character's Warcraft Logs reports
        would fetch
      tags:
      - settings
  /api/settings/warcraftlogs/imported:
    delete:
      description: Stops the import and deletes what it fetched; importing them again
        spends the points again.
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Remove every key and raid pull imported from Warcraft Logs
      tags:
      - settings
  /api/settings/warcraftlogs/parses:
    get:
      description: |-
        The settings' character's best and median parse in each Mythic+ dungeon of the season and each boss
        of the current raid it has a ranked run or kill in, with its Warcraft Logs page (found false when
        Warcraft Logs doesn't know the character). Read once a day; a read costs a few points.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CharacterParses'
        "400":
          description: No character, or one that doesn't fit
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: No Warcraft Logs keys saved
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "502":
          description: Warcraft Logs couldn't be reached
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: The character's Warcraft Logs parses this season
      tags:
      - settings
  /api/settings/warcraftlogs/test:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.KeyStatus'
        "404":
          description: No keys saved
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "422":
          description: Warcraft Logs turned the keys down
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "502":
          description: Warcraft Logs couldn't be reached
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Test the saved Warcraft Logs keys again
      tags:
      - settings
swagger: "2.0"

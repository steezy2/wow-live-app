<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- WoW Live's icon, 48 px and up: a purple keystone gem crossed by a live pulse line, in a gold-framed tile like
       an ability button. Original art: no Blizzard logo, font or game art. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1748"/>
      <stop offset="1" stop-color="#0c0717"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="0.5" stop-color="#c58a2c"/>
      <stop offset="1" stop-color="#6e4313"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b65cff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#b65cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9c6ff"/>
      <stop offset="0.45" stop-color="#a335ee"/>
      <stop offset="1" stop-color="#3d0c73"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="44" fill="url(#rim)"/>
  <rect x="22" y="22" width="212" height="212" rx="32" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="96" fill="url(#glow)"/>
  <path d="M128 50 L192 88 L192 168 L128 206 L64 168 L64 88 Z" fill="url(#gem)" stroke="#f3dcff" stroke-opacity="0.5"
    stroke-width="3"/>
  <path d="M128 50 L192 88 L128 126 L64 88 Z" fill="#ffffff" fill-opacity="0.28"/>
  <path d="M128 126 L128 206 L64 168 L64 88 Z" fill="#000000" fill-opacity="0.18"/>
  <path d="M30 136 H86 L100 104 L120 170 L140 86 L158 150 L170 136 H226" fill="none" stroke="#0c0717"
    stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M30 136 H86 L100 104 L120 170 L140 86 L158 150 L170 136 H226" fill="none" stroke="#7ff7e1"
    stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
</svg>

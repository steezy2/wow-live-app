# The item levels the Droptimizer sims each drop at, kept by hand. cmd/simref copies them into
# reference/sim-drops.json beside the season's raid and dungeon gear (from wago.tools). Check them in the game each
# season (a drop's tooltip, or the Encounter Journal set to the difficulty) and note what you checked.
#
# Read Nov 15 2026 from warcraft.wiki.gg/wiki/Midnight_Season_2 (Method's Season 2 charts agree on the raid's Mythic
# levels and M0 to +5). Every value below is UNVERIFIED in the game until a line says "checked".

season = "season-mn-2" # reference/mplus-dungeons.json's season: cmd/simref refuses another
display_season = 37    # JournalEncounterItem.DisplaySeasonID of this season's raid loot (its trophies)
heroic_dungeon = 276   # Adventurer 4

# The Venomous Abyss: the bosses of each group (Encounter Journal names) and what each difficulty drops.
# Ula'tek and The Coiled Altar's Mythic 344 (Myth 9, past the track's 334) is what both sources say; the wiki's
# "rare" drops (309/322/335) aren't told apart in the journal, so they sim at their boss's level.

[[raid]]
bosses = ["Nek'zali the Soulcoiler"]
levels = { lfr = 279, normal = 292, heroic = 305, mythic = 318 }

[[raid]]
bosses = ["Entombed Sentinels", "The Lost Explorers"]
levels = { lfr = 282, normal = 295, heroic = 308, mythic = 321 }

[[raid]]
bosses = ["Vashnik the Malignant", "Sszorak", "The Twin Fangs"]
levels = { lfr = 285, normal = 298, heroic = 311, mythic = 324 }

[[raid]]
bosses = ["The Coiled Altar", "Ula'tek"]
levels = { lfr = 289, normal = 302, heroic = 315, mythic = 344 }


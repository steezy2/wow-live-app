# The Venomous Abyss's boss mechanics, kept by hand. cmd/raidref merges each boss here over what it sorts from
# Wowhead's cheat sheets into reference/raid-bosses.json: a boss listed here takes every mechanic list from this file.
#
# Spell IDs are the ones the combat log shows for what the app matches: avoidable and soaks are damage on raiders
# (SPELL_DAMAGE), dispel, stacks, pickups and breaks are auras on raiders, must_stop are enemy casts
# (SPELL_CAST_START), spawn causes either. Guides often give a cast's ID where the hit has another one.
#
# Sources per boss: Mythic Trap (mythictrap.com/en/venomous-abyss/<boss>/mythic) and Method's guides for what each
# mechanic is; each ID checked against the owner's logs (checked = "log ...") or against the damage taken, debuffs and
# enemy casts of the boss's top Mythic kill on Warcraft Logs (checked = "wcl <report>#<fight>"), read Nov 10 2026.
#
# Per boss: health (NPC IDs whose health is the boss's; leave out for "the NPC named as the encounter, else all"),
# avoidable, dispel, must_stop, stacks (aura ID = the stacks that are too many, 0 when no number), priority (add
# names to burst), [[soaks]] (spell, soakers wanted per cast, 0 = everyone), [[pickups]], [[breaks]] and [[spawns]].


# Keeps the SimulationCraft engine the app's Sim tab downloads: weekly, takes the newest official Windows nightly from
# simulationcraft/simc-publish's Actions artifacts (HTTPS, checked against the sha256 GitHub lists for the artifact),
# runs it once, and publishes simc.exe and engine.json (its sha256, source file and build time) on the release tagged
# simc-engine. The app (backend/clients/simc) installs from that release and checks the sha256 itself. Nothing is
# published when a step fails, so the last good engine stays. Only runs on main: a release made from another branch
# would be a way to put a different program in front of every user.
name: SimulationCraft engine

on:
  schedule:
    - cron: "0 12 * * 3" # Wednesdays, after the weekly hotfixes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }} # there is no checkout for gh to read the repo from
    steps:
      - name: Newest official Windows nightly
        run: |
          gh api 'repos/simulationcraft/simc-publish/actions/artifacts?per_page=30' --jq '
            [.artifacts[] | select((.name | startswith("simc-nightly-win64")) and (.expired | not))][0]' > artifact.json
          id=$(jq -r .id artifact.json)
          [ "$id" != null ] || { echo "no unexpired simc-nightly-win64 artifact"; exit 1; }
          gh api "repos/simulationcraft/simc-publish/actions/artifacts/$id/zip" > artifact.zip
          want=$(jq -r '.digest | ltrimstr("sha256:")' artifact.json)
          got=$(sha256sum artifact.zip | cut -d' ' -f1)
          [ "$want" = "$got" ] || { echo "artifact sha256 $got is not GitHub's $want"; exit 1; }
          7z x -oartifact artifact.zip > /dev/null
          7z x -onightly artifact/simc-*-win64.7z > /dev/null
          file=$(basename artifact/simc-*-win64.7z)
          echo "file=$file" >> "$GITHUB_ENV"
          echo "built=$(date -d "$(jq -r .created_at artifact.json)" +%s)000" >> "$GITHUB_ENV"
      - name: Skip when the release already has it
        run: |
          current=$(gh release download simc-engine --repo "$GITHUB_REPOSITORY" --pattern engine.json --output - 2>/dev/null \
            | jq -r 'select((.version // "") != "") | .file' || true) # a release without a version is published again
          if [ "$current" = "$file" ]; then echo "skip=true" >> "$GITHUB_ENV"; echo "$file is already published"; fi
      - name: Check it runs
        if: env.skip != 'true'
        run: |
          exe=$(find nightly -name simc.exe | head -1)
          [ -n "$exe" ] || { echo "no simc.exe in $file"; exit 1; }
          cp "$exe" simc.exe
          ./simc.exe 2>&1 | tee banner.txt || true
          grep -q 'SimulationCraft .* for World of Warcraft' banner.txt
          echo "version=$(sed -n 's/.*SimulationCraft \([^ ]*\) for World of Warcraft.*/\1/p' banner.txt | head -1)" >> "$GITHUB_ENV"
          echo "patch=$(sed -n 's/.*for World of Warcraft \([^ ]*\).*/\1/p' banner.txt | head -1)" >> "$GITHUB_ENV"
      - name: Publish
        if: env.skip != 'true'
        run: |
          sum=$(sha256sum simc.exe | cut -d' ' -f1)
          jq -n --arg file "$file" --argjson built "$built" --arg sha "$sum" --arg version "$version" \
            --arg patch "$patch" '{file: $file, builtMS: $built, sha256: $sha, version: $version, patch: $patch}' > engine.json
          commit=${file%-win64.7z}; commit=${commit##*.}
          notes="SimulationCraft nightly \`$file\` (source: https://github.com/simulationcraft/simc/commit/$commit), unchanged,"
          notes="$notes from simulationcraft/simc-publish's Actions artifact, whose sha256 matched GitHub's. GPL-3.0."
          notes="$notes sha256 of simc.exe: \`$sum\`."
          gh release view simc-engine > /dev/null 2>&1 || gh release create simc-engine --latest=false \
            --title "SimulationCraft engine" --notes "$notes" --target "$GITHUB_SHA"
          gh release edit simc-engine --notes "$notes" --latest=false
          gh release upload simc-engine simc.exe engine.json --clobber

# Builds WoW Live's Windows installer and its SHA-256 on a version tag (v0.2.0) and releases them in this repo, with a
# build provenance attestation once the repo is public (GitHub attests private repos only on Enterprise), so anyone
# can check an installer came from this workflow and commit: gh attestation verify "WoW Live Setup.exe" -R <this repo>.
# Not on PRs: the Windows build takes about 5 minutes and CI covers the code; run it by hand (Actions, Run workflow)
# to get the installer as an artifact without a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bash backend/cmd/app/build.sh
      - name: Tests (Windows, with the app)
        run: |
          (cd backend && go vet ./... && go test ./...)
          (cd frontend && npm test)
      - name: Installer and checksum
        run: |
          command -v makensis || choco install nsis --no-progress -y
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          version=0.0.0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          makensis -DVERSION="$version" backend/cmd/app/installer.nsi
          cd bin && sha256sum "WoW Live Setup.exe" > "WoW Live Setup.exe.sha256" && cat "WoW Live Setup.exe.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: wow-live-installer
          path: bin/WoW Live Setup.exe*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job, and only on tags, can make a release
      id-token: write # with attestations, to sign the provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wow-live-installer
      - if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: WoW Live Setup.exe
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "WoW Live Setup.exe" "WoW Live Setup.exe.sha256"
          --repo "$GITHUB_REPOSITORY" --title "WoW Live $GITHUB_REF_NAME"
          --notes "It's unsigned, so Windows SmartScreen warns on first run: More info, then Run anyway. Install steps are in the README."

# Builds the Microsoft Store's MSIX on a version tag (v0.2.0) and keeps it on a release in this repo, to upload by hand
# to Partner Center, which signs it (it can't be installed before that). Its identity is in the repo's MSIX_* variables,
# from Partner Center's Product identity page.
# Not on PRs: the Windows build takes about 5 minutes and CI covers the code; run it by hand (Actions, Run workflow)
# to get the MSIX as an artifact without a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msix:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: bash backend/cmd/app/build.sh
      - name: Tests (Windows, with the app)
        run: |
          (cd backend && go vet ./... && go test ./...)
          (cd frontend && npm test)
      - name: Version
        run: |
          version=0.0.0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Store package
        env:
          MSIX_NAME: ${{ vars.MSIX_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_NAME: ${{ vars.MSIX_PUBLISHER_NAME }}
        run: bash backend/cmd/app/msix/pack.sh "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: wow-live-msix
          path: bin/WoW Live.msix

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: msix
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job, and only on tags, can make a release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wow-live-msix
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "WoW Live.msix" --repo "$GITHUB_REPOSITORY"
          --title "WoW Live $GITHUB_REF_NAME" --notes "Unsigned: upload it to Partner Center, which signs it for the Store."

# Builds WoW Live's Windows installer and its SHA-256 (and the Store's MSIX, as an artifact) on a version tag (v0.2.0)
# and releases the installer in this repo, with a build provenance attestation while the repo is public (GitHub attests
# private repos only on Enterprise); the README says how to check one.
# Not on PRs: the Windows build takes about 5 minutes and CI covers the code; run it by hand (Actions, Run workflow)
# to get the installer as an artifact without a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bash backend/cmd/app/build.sh
      - name: Tests (Windows, with the app)
        run: |
          (cd backend && go vet ./... && go test ./...)
          (cd frontend && npm test)
      - name: Version
        run: |
          version=0.0.0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Installer and checksum
        run: |
          command -v makensis || choco install nsis --no-progress -y
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          makensis -DVERSION="$VERSION" backend/cmd/app/installer.nsi
          cd bin && sha256sum "WoW Live Setup.exe" > "WoW Live Setup.exe.sha256" && cat "WoW Live Setup.exe.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: wow-live-installer
          path: bin/WoW Live Setup.exe*
      # The Store package, uploaded by hand to Partner Center, which signs it; not in the release, since it can't be
      # installed unsigned. Its identity is in the repo's MSIX_* variables, from Partner Center's Product identity page.
      - name: Store package
        if: vars.MSIX_PUBLISHER != ''
        continue-on-error: true # a bad package mustn't hold back the installer's release
        env:
          MSIX_NAME: ${{ vars.MSIX_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_NAME: ${{ vars.MSIX_PUBLISHER_NAME }}
        run: bash backend/cmd/app/msix/pack.sh "$VERSION"
      - if: vars.MSIX_PUBLISHER != ''
        uses: actions/upload-artifact@v4
        with:
          name: wow-live-msix
          path: bin/WoW Live.msix

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job, and only on tags, can make a release
      id-token: write # with attestations, to sign the provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wow-live-installer
      - if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: WoW Live Setup.exe
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "WoW Live Setup.exe" "WoW Live Setup.exe.sha256"
          --repo "$GITHUB_REPOSITORY" --title "WoW Live $GITHUB_REF_NAME"
          --notes "It's unsigned, so Windows SmartScreen warns on first run: More info, then Run anyway. Install steps are in the README."
      # The same files on steezy2/wow-live, the installers-only repo the first testers have the link to (RELEASES_TOKEN:
      # a fine-grained token with Contents read and write on that repo alone).
      - if: github.repository == 'steezy2/wow-live-app'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME" "WoW Live Setup.exe" "WoW Live Setup.exe.sha256"
          --repo steezy2/wow-live --title "WoW Live $GITHUB_REF_NAME"
          --notes "Built and attested in https://github.com/steezy2/wow-live-app. It's unsigned, so Windows SmartScreen warns on first run: More info, then Run anyway."
